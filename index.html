  <!-- ================= Conversions API (CAPI) — recommended setup =================
       The browser Pixel loses a large share of events to ad blockers, iOS ATT and
       cookie limits. Send the same events server-side as well:

       1. Events: PageView, Lead (fired on every registration CTA click by App.jsx),
          Contact (WhatsApp clicks), and CompleteRegistration — fire it from your server / form
          submission handler, never from the browser.
       2. De-duplication: App.jsx passes an `eventID` with each browser event.
          Forward that same id to your server (e.g. as a query param on the
          checkout URL) and send it as `event_id` in the CAPI payload, with the
          same `event_name`. Meta then counts the event once.
       3. Match quality: send hashed (SHA-256, lower-cased, trimmed) em and ph,
          plus client_ip_address, client_user_agent, and the _fbp / _fbc cookies.
          Build _fbc from the `fbclid` URL param if the cookie is missing.
       4. Endpoint: POST https://graph.facebook.com/v{latest}/{PIXEL_ID}/events
          with an access token from Events Manager. Keep the token server-side.
          The zero-code route is Events Manager → Conversions API Gateway, or
          your payment provider's native Meta integration.
